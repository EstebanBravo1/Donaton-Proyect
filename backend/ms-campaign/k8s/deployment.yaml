apiVersion: apps/v1
kind: Deployment

metadata:
  name: ms-campaign


spec:

  replicas: 1


  selector:

    matchLabels:
      app: ms-campaign


  template:

    metadata:

      labels:
        app: ms-campaign


    spec:

      containers:

        - name: ms-campaign

          image: donaton-proyect-ms-campaign:latest
          imagePullPolicy: IfNotPresent
          env:
          - name: SPRING_DATASOURCE_URL
            value: "jdbc:postgresql://postgres-shared-service:5432/db_campaign" # <- Apunta a db_campaign
          - name: SPRING_DATASOURCE_USERNAME
            value: "root"
          - name: SPRING_DATASOURCE_PASSWORD
            value: "secret"

          ports:

            - containerPort: 8084