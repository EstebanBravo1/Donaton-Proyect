apiVersion: apps/v1
kind: Deployment

metadata:
  name: ms-donation

spec:

  replicas: 1

  selector:
    matchLabels:
      app: ms-donation


  template:

    metadata:
      labels:
        app: ms-donation


    spec:

      containers:

        - name: ms-donation

          image: donaton-proyect-ms-donation:latest
          imagePullPolicy: IfNotPresent
          env:
          - name: SPRING_DATASOURCE_URL
            value: "jdbc:postgresql://postgres-shared-service:5432/db_donation" # <- Apunta a db_donation
          - name: SPRING_DATASOURCE_USERNAME
            value: "root"
          - name: SPRING_DATASOURCE_PASSWORD
            value: "secret"

          ports:

            - containerPort: 8083